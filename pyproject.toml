[project]
name = "astro-ib-probe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "astropt>=2.0.9",
    "boto3>=1.43.66",
    "datasets>=5.0.1",
    "huggingface-hub>=1.27.0",
    "matplotlib>=3.11.1",
    "numpy>=2.5.1",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
]

[project.scripts]
astro-ib-probe = "astro_ib_probe:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
